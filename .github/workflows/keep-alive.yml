name: Supabase keep-alive

on:
  schedule:
    - cron: "0 12 * * 1,4" # lunes y jueves, 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query Supabase
        run: |
          curl -sf "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/retrospectives?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.VITE_SUPABASE_ANON_KEY }}"
